name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"      # run daily
  workflow_dispatch:         # run manually
  push:
    branches: [main]
    paths:
      - ".github/workflows/snake.yml"   # only when this file changes

permissions:
  contents: write            # needed to update the output branch

concurrency:
  group: snake
  cancel-in-progress: true   # no overlapping runs

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10      # stop if stuck

    steps:
      # 1. make the snake images
      - name: Generate snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#7C3AED&color_dots=#161b22,#0c4a6e,#0369a1,#0ea5e9,#38bdf8

      # 2. save them to the "output" branch
      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
